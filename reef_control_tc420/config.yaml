name: Reef Control TC420 USB
version: "0.3.0"
slug: reef_control_tc420
description: USB bridge for Reef Control and TC420 / SIMU-LUX lighting controllers
url: https://github.com/shdtfy/ha-reef-control
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
usb: true
homeassistant_api: true
options:
  bridge_enabled: false
  ha_poll_interval: 1
  sync_time_on_connect: false
  poll_interval: 5
  live_test_token: 0
  live_test_channel: 1
  live_test_level: 10
  live_test_seconds: 3
schema:
  bridge_enabled: bool
  ha_poll_interval: int
  sync_time_on_connect: bool
  poll_interval: int
  live_test_token: int
  live_test_channel: int
  live_test_level: int
  live_test_seconds: int
